# Install once per clone: uv run pre-commit install
# (installs both the pre-commit and pre-push hooks, see default_install_hook_types)
# - pre-commit: ruff on staged files before `git commit`
# - pre-push:   tests against the newest dependency versions users would get
#               (scripts/check_latest_deps.sh, ~1-2 min, needs network).
#               Skip once with `git push --no-verify`.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        files: ^(src/|tests/)
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src/|tests/)
  - repo: local
    hooks:
      - id: latest-deps
        name: tests against newest dependency versions
        entry: ./scripts/check_latest_deps.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
